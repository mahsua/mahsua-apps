    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light Mode - Pink, Blue, Green Theme */
            --bg-gradient-start: #ffe6f0;
            --bg-gradient-middle: #e0f3ff;
            --bg-gradient-end: #e6ffe6;
            --container-bg: rgba(255, 255, 255, 0.94);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #1f2937;
            --label-color: #4b5563;
            --muted-color: #6b7280;
            --input-bg: rgba(255, 255, 255, 0.96);
            --input-border: rgba(236, 72, 153, 0.28);
            --input-focus-border: #ec489a;
            --button-bg: linear-gradient(135deg, #ec489a, #3b82f6);
            --button-hover-bg: linear-gradient(135deg, #db2777, #2563eb);
            --button-green-bg: linear-gradient(135deg, #22c55e, #16a34a);
            --button-shadow: rgba(236, 72, 153, 0.28);
            --result-border: rgba(236, 72, 153, 0.2);
            --result-item-bg: rgba(255, 255, 255, 0.82);
            --chip-bg: rgba(236, 72, 153, 0.08);
            --chip-border: rgba(236, 72, 153, 0.22);
            --chip-text: #be185d;
            --glass-border: rgba(236, 72, 153, 0.22);
            --message-box-bg: #dcfce7;
            --message-box-text: #15803d;
            --message-box-border: #86efac;
            --message-box-error-bg: #fee2e2;
            --message-box-error-text: #dc2626;
            --message-box-error-border: #fecaca;
        }

        [data-mode="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-middle: #16213e;
            --bg-gradient-end: #0f3460;
            --container-bg: rgba(20, 30, 48, 0.94);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f1f5f9;
            --label-color: #cbd5e1;
            --muted-color: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.85);
            --input-border: rgba(236, 72, 153, 0.35);
            --result-border: rgba(236, 72, 153, 0.25);
            --result-item-bg: rgba(30, 41, 59, 0.85);
            --chip-bg: rgba(236, 72, 153, 0.16);
            --chip-border: rgba(236, 72, 153, 0.35);
            --chip-text: #f9a8d4;
            --glass-border: rgba(236, 72, 153, 0.25);
            --message-box-bg: #143325;
            --message-box-text: #34d399;
            --message-box-border: #10b981;
            --message-box-error-bg: #631717;
            --message-box-error-text: #fca5a5;
            --message-box-error-border: #ef4444;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-middle) 50%, var(--bg-gradient-end) 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 76px 16px 32px;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(236, 72, 153, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                radial-gradient(circle at top left, rgba(236, 72, 153, 0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.1), transparent 26%);
            background-size: 26px 26px, 26px 26px, 100% 100%, 100% 100%;
            z-index: 0;
        }

        .top-bar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .top-pill-btn {
            pointer-events: auto;
            padding: 0.6rem 1.1rem;
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: 'Outfit', sans-serif;
        }

        .top-pill-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(236, 72, 153, 0.2);
        }

        .container {
            background-color: var(--container-bg);
            backdrop-filter: blur(20px);
            padding: 2.25rem;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 580px;
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
            animation: riseIn 0.6s ease-out;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-row {
            text-align: center;
            margin-bottom: 1.4rem;
        }

        h1 {
            background: linear-gradient(135deg, #ec489a, #3b82f6, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: var(--muted-color);
            font-size: 0.94rem;
        }

        /* Password Output Box */
        .password-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.08), rgba(59, 130, 246, 0.08), rgba(34, 197, 94, 0.08));
            border: 1.5px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.15rem 1.25rem;
            margin-bottom: 1.15rem;
        }

        .password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        #passwordDisplay {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            word-break: break-all;
            flex: 1;
            letter-spacing: 0.5px;
            user-select: all;
        }

        .icon-actions {
            display: flex;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            border-color: var(--input-focus-border);
            transform: translateY(-2px);
        }

        /* Strength Meter */
        .strength-wrap {
            margin-top: 0.9rem;
        }

        .strength-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--muted-color);
        }

        .strength-label {
            font-weight: 700;
        }

        .strength-bar-track {
            width: 100%;
            height: 7px;
            background: rgba(148, 163, 184, 0.22);
            border-radius: 50px;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Controls Card */
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.25rem;
            margin-bottom: 1.15rem;
        }

        .length-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.65rem;
        }

        .length-header label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--label-color);
        }

        .length-number {
            width: 68px;
            padding: 0.4rem 0.5rem;
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            font-family: 'Outfit', sans-serif;
        }

        .length-number:focus {
            outline: none;
            border-color: var(--input-focus-border);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 50px;
            background: rgba(148, 163, 184, 0.28);
            outline: none;
            margin: 0.35rem 0 0.85rem;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec489a, #3b82f6);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.4);
            border: 2px solid #ffffff;
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec489a, #3b82f6);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.4);
            border: 2px solid #ffffff;
        }

        .preset-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-bottom: 1.1rem;
            align-items: center;
        }

        .preset-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted-color);
            margin-right: 0.2rem;
        }

        .chip-btn {
            padding: 0.28rem 0.7rem;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 50px;
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            color: var(--chip-text);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .chip-btn:hover,
        .chip-btn.active {
            background: var(--button-bg);
            color: #ffffff;
            border-color: transparent;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.65rem;
        }

        .option-tile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 0.9rem;
            background: var(--result-item-bg);
            border: 1px solid var(--result-border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .option-tile:hover {
            border-color: var(--input-focus-border);
        }

        .option-tile span {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .option-tile small {
            display: block;
            font-size: 0.72rem;
            color: var(--muted-color);
            font-weight: 500;
        }

        .option-tile input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #ec489a;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-tile.full-span {
            grid-column: span 2;
        }

        /* Action Buttons */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .primary-btn {
            padding: 0.95rem 1.25rem;
            border: none;
            border-radius: 18px;
            font-size: 0.98rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .btn-generate {
            background: var(--button-bg);
            box-shadow: 0 6px 18px var(--button-shadow);
        }

        .btn-copy {
            background: var(--button-green-bg);
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.25);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
        }

        /* Recent Session History */
        .history-section {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--result-border);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .history-header h3 {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--label-color);
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: #ec489a;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 0.85rem;
            background: var(--result-item-bg);
            border: 1px solid var(--result-border);
            border-radius: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.84rem;
            color: var(--text-color);
        }

        .history-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-copy-btn {
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            color: var(--chip-text);
            padding: 0.22rem 0.6rem;
            border-radius: 50px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            flex-shrink: 0;
        }

        .copyright {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            text-align: center;
            color: var(--muted-color);
        }

        .copyright a {
            color: #ec489a;
            text-decoration: none;
            font-weight: 600;
        }

        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--message-box-bg);
            color: var(--message-box-text);
            padding: 0.8rem 1.35rem;
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--message-box-border);
            font-weight: 600;
            font-size: 0.88rem;
        }

        .message-box.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box.error {
            background-color: var(--message-box-error-bg);
            color: var(--message-box-error-text);
            border-color: var(--message-box-error-border);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 68px 12px 24px;
            }
            .container {
                padding: 1.35rem;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.85rem;
            }
            #passwordDisplay {
                font-size: 1.15rem;
            }
            .options-grid,
            .action-row {
                grid-template-columns: 1fr;
            }
            .option-tile.full-span {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="https://apps.mahsua.com/" class="top-pill-btn">
            <span>🏠</span> <span>Mahsua Apps</span>
        </a>
        <button id="modeToggleBtn" class="top-pill-btn" onclick="toggleDarkMode()">
            <span id="modeIcon">🌙</span> <span id="modeText">Dark Mode</span>
        </button>
    </div>

    <div class="container">
        <div class="header-row">
            <h1>🔐 Password Generator</h1>
            <p class="subtitle">Cryptographically secure passwords with live strength check</p>
        </div>

        <!-- Generated Password Box -->
        <div class="password-box">
            <div class="password-row">
                <span id="passwordDisplay"></span>
                <div class="icon-actions">
                    <button type="button" class="icon-btn" title="Generate new password" onclick="generatePassword()">🔄</button>
                    <button type="button" class="icon-btn" title="Copy password" onclick="copyPassword()">📋</button>
                </div>
            </div>

            <div class="strength-wrap">
                <div class="strength-meta">
                    <span id="strengthText" class="strength-label">Strong</span>
                    <span id="entropyText">0 bits</span>
                </div>
                <div class="strength-bar-track">
                    <div class="strength-bar-fill" id="strengthBar"></div>
                </div>
            </div>
        </div>

        <!-- Customization Settings -->
        <div class="settings-card">
            <div class="length-header">
                <label for="lengthNumber">Password Length</label>
                <input type="number" id="lengthNumber" class="length-number" min="6" max="64" value="16">
            </div>
            <input type="range" id="lengthRange" min="6" max="64" value="16">

            <div class="preset-chips">
                <span class="preset-label">Quick length:</span>
                <button type="button" class="chip-btn" onclick="setLengthPreset(8)">8</button>
                <button type="button" class="chip-btn active" onclick="setLengthPreset(16)">16</button>
                <button type="button" class="chip-btn" onclick="setLengthPreset(24)">24</button>
                <button type="button" class="chip-btn" onclick="setLengthPreset(32)">32</button>
                <button type="button" class="chip-btn" onclick="setLengthPreset(48)">48</button>
            </div>

            <div class="options-grid">
                <label class="option-tile">
                    <div>
                        <span>Uppercase</span>
                        <small>A – Z</small>
                    </div>
                    <input type="checkbox" id="includeUppercase" checked>
                </label>

                <label class="option-tile">
                    <div>
                        <span>Lowercase</span>
                        <small>a – z</small>
                    </div>
                    <input type="checkbox" id="includeLowercase" checked>
                </label>

                <label class="option-tile">
                    <div>
                        <span>Numbers</span>
                        <small>0 – 9</small>
                    </div>
                    <input type="checkbox" id="includeNumbers" checked>
                </label>

                <label class="option-tile">
                    <div>
                        <span>Symbols</span>
                        <small>!@#$%^&amp;*</small>
                    </div>
                    <input type="checkbox" id="includeSymbols" checked>
                </label>

                <label class="option-tile full-span">
                    <div>
                        <span>Avoid Ambiguous Characters</span>
                        <small>Excludes similar-looking characters (0, O, 1, l, I)</small>
                    </div>
                    <input type="checkbox" id="excludeAmbiguous">
                </label>
            </div>
        </div>

        <!-- Primary Actions -->
        <div class="action-row">
            <button type="button" class="primary-btn btn-generate" onclick="generatePassword()">🔄 Generate New</button>
            <button type="button" class="primary-btn btn-copy" onclick="copyPassword()">📋 Copy Password</button>
        </div>

        <!-- Recent Session History -->
        <div class="history-section hidden" id="historySection">
            <div class="history-header">
                <h3>🕒 Recent in This Session</h3>
                <button type="button" class="clear-history-btn" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="copyright">
            Made With ❤️ INDIA ~ Designed by <a href="https://proshivamkushwaha.mahsua.com" target="_blank">SHIVAM KUSHWAHA</a> | © <a href="https://www.mahsua.com" target="_blank">MAHSUA</a>
        </div>
    </div>

    <div id="messageBox" class="message-box"></div>

    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const lengthNumber = document.getElementById('lengthNumber');
        const lengthRange = document.getElementById('lengthRange');
        const includeUppercase = document.getElementById('includeUppercase');
        const includeLowercase = document.getElementById('includeLowercase');
        const includeNumbers = document.getElementById('includeNumbers');
        const includeSymbols = document.getElementById('includeSymbols');
        const excludeAmbiguous = document.getElementById('excludeAmbiguous');
        const strengthText = document.getElementById('strengthText');
        const entropyText = document.getElementById('entropyText');
        const strengthBar = document.getElementById('strengthBar');
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');
        const modeIcon = document.getElementById('modeIcon');
        const modeText = document.getElementById('modeText');
        const messageBox = document.getElementById('messageBox');

        let currentTheme = localStorage.getItem('displayMode') || 'light';
        let sessionHistory = [];

        const CHAR_SETS = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()-_=+[]{}|;:,.<>?'
        };
        const AMBIGUOUS_RE = /[0O1lI]/g;

        function applyTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-mode', theme);
            localStorage.setItem('displayMode', theme);
            modeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
            modeText.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
        }

        function toggleDarkMode() {
            applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        }

        function secureRandomInt(max) {
            const arr = new Uint32Array(1);
            const limit = Math.floor(0x100000000 / max) * max;
            let rand;
            do {
                window.crypto.getRandomValues(arr);
                rand = arr[0];
            } while (rand >= limit);
            return rand % max;
        }

        function getRandomChar(str) {
            return str[secureRandomInt(str.length)];
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getActiveSets() {
            const strip = excludeAmbiguous.checked;
            const clean = s => strip ? s.replace(AMBIGUOUS_RE, '') : s;
            const sets = [];
            if (includeUppercase.checked) sets.push(clean(CHAR_SETS.uppercase));
            if (includeLowercase.checked) sets.push(clean(CHAR_SETS.lowercase));
            if (includeNumbers.checked) sets.push(clean(CHAR_SETS.numbers));
            if (includeSymbols.checked) sets.push(clean(CHAR_SETS.symbols));
            return sets.filter(Boolean);
        }

        function generatePassword(addToHistory = true) {
            const length = Math.min(64, Math.max(6, parseInt(lengthNumber.value, 10) || 16));
            lengthNumber.value = length;
            lengthRange.value = length;

            const activeSets = getActiveSets();
            if (activeSets.length === 0) {
                displayMessage('Select at least one character type!', 'error');
                return;
            }

            const pool = activeSets.join('');
            const chars = [];

            // Guarantee at least one char from each selected set
            activeSets.forEach(set => {
                if (chars.length < length) {
                    chars.push(getRandomChar(set));
                }
            });

            while (chars.length < length) {
                chars.push(getRandomChar(pool));
            }

            const password = shuffleArray(chars).join('');
            const prev = passwordDisplay.textContent;
            if (addToHistory && prev && prev !== password) {
                sessionHistory.unshift(prev);
                sessionHistory = sessionHistory.slice(0, 5);
                renderHistory();
            }

            passwordDisplay.textContent = password;
            updateStrength(length, pool.length);
            updateLengthChipHighlight(length);
        }

        function updateStrength(length, poolSize) {
            const entropy = Math.round(length * Math.log2(Math.max(1, poolSize)));
            entropyText.textContent = `${entropy} bits`;

            let label = 'Weak';
            let color = '#ef4444';
            let pct = 25;

            if (entropy >= 90) {
                label = 'Very Strong';
                color = '#16a34a';
                pct = 100;
            } else if (entropy >= 65) {
                label = 'Strong';
                color = '#22c55e';
                pct = 78;
            } else if (entropy >= 45) {
                label = 'Fair';
                color = '#f59e0b';
                pct = 52;
            }

            strengthText.textContent = label;
            strengthText.style.color = color;
            strengthBar.style.width = `${pct}%`;
            strengthBar.style.backgroundColor = color;
        }

        function updateLengthChipHighlight(len) {
            document.querySelectorAll('.chip-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent, 10) === len);
            });
        }

        function setLengthPreset(len) {
            lengthNumber.value = len;
            lengthRange.value = len;
            generatePassword();
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    displayMessage('Password copied to clipboard!');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                displayMessage('Password copied to clipboard!');
            } catch {
                displayMessage('Failed to copy password.', 'error');
            }
            document.body.removeChild(ta);
        }

        function copyPassword() {
            const pwd = passwordDisplay.textContent;
            if (!pwd) return;
            copyText(pwd);
        }

        function renderHistory() {
            historySection.classList.toggle('hidden', sessionHistory.length === 0);
            historyList.innerHTML = '';
            sessionHistory.forEach(pwd => {
                const row = document.createElement('div');
                row.className = 'history-item';

                const span = document.createElement('span');
                span.className = 'history-text';
                span.textContent = pwd;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'history-copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => copyText(pwd);

                row.appendChild(span);
                row.appendChild(btn);
                historyList.appendChild(row);
            });
        }

        function clearHistory() {
            sessionHistory = [];
            renderHistory();
        }

        function displayMessage(msg, type = 'success') {
            messageBox.textContent = msg;
            messageBox.className = 'message-box show' + (type === 'error' ? ' error' : '');
            setTimeout(() => messageBox.classList.remove('show'), 2600);
        }

        lengthNumber.addEventListener('input', () => {
            let val = parseInt(lengthNumber.value, 10);
            if (!isNaN(val)) {
                val = Math.min(64, Math.max(6, val));
                lengthRange.value = val;
                generatePassword(false);
            }
        });

        lengthRange.addEventListener('input', () => {
            lengthNumber.value = lengthRange.value;
            generatePassword(false);
        });

        [includeUppercase, includeLowercase, includeNumbers, includeSymbols].forEach(cb => {
            cb.addEventListener('change', () => {
                if (!includeUppercase.checked && !includeLowercase.checked && !includeNumbers.checked && !includeSymbols.checked) {
                    cb.checked = true;
                    displayMessage('At least one character type is required.', 'error');
                    return;
                }
                generatePassword(false);
            });
        });

        excludeAmbiguous.addEventListener('change', () => generatePassword(false));

        window.onload = function() {
            applyTheme(currentTheme);
            generatePassword(false);
        };
    </script>
</body>
</html>
