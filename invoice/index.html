<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator - Mahsua Apps</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9351361840615541" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-9351361840615541">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3YBTXHNJY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-T3YBTXHNJY');
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #ffe6f0;
            --bg-gradient-middle: #e0f3ff;
            --bg-gradient-end: #e6ffe6;
            --shell-bg: rgba(255, 255, 255, 0.92);
            --text-color: #1f2937;
            --muted-color: #6b7280;
            --glass-border: rgba(236, 72, 153, 0.22);
            --button-bg: linear-gradient(135deg, #ec489a, #3b82f6);
            --button-green-bg: linear-gradient(135deg, #22c55e, #16a34a);
            --button-shadow: rgba(236, 72, 153, 0.25);
            --message-box-bg: #dcfce7;
            --message-box-text: #15803d;
            --message-box-border: #86efac;
            --message-box-error-bg: #fee2e2;
            --message-box-error-text: #dc2626;
            --message-box-error-border: #fecaca;
        }

        [data-mode="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-middle: #16213e;
            --bg-gradient-end: #0f3460;
            --shell-bg: rgba(20, 30, 48, 0.92);
            --text-color: #f1f5f9;
            --muted-color: #94a3b8;
            --glass-border: rgba(236, 72, 153, 0.28);
            --message-box-bg: #143325;
            --message-box-text: #34d399;
            --message-box-border: #10b981;
            --message-box-error-bg: #631717;
            --message-box-error-text: #fca5a5;
            --message-box-error-border: #ef4444;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-middle) 50%, var(--bg-gradient-end) 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 74px 16px 36px;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(236, 72, 153, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                radial-gradient(circle at top left, rgba(236, 72, 153, 0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.1), transparent 26%);
            background-size: 26px 26px, 26px 26px, 100% 100%, 100% 100%;
            z-index: 0;
        }

        .top-bar {
            position: fixed;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .top-pill-btn {
            pointer-events: auto;
            padding: 0.55rem 1.05rem;
            background: var(--shell-bg);
            backdrop-filter: blur(20px);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: 'Outfit', sans-serif;
        }

        .top-pill-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(236, 72, 153, 0.2);
        }

        /* Toolbar above invoice paper */
        .app-toolbar {
            max-width: 860px;
            margin: 0 auto 16px;
            background: var(--shell-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .toolbar-title-wrap h1 {
            background: linear-gradient(135deg, #ec489a, #3b82f6, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .toolbar-title-wrap p {
            font-size: 0.8rem;
            color: var(--muted-color);
        }

        .toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 0.58rem 1rem;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--button-bg);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--button-shadow);
        }

        .btn-green {
            background: var(--button-green-bg);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 1.5px solid var(--glass-border);
        }

        .btn-danger-soft {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        /* ======================================================
           INVOICE PAPER (Always crisp white for PDF & Print)
           ====================================================== */
        .invoice-container {
            max-width: 860px;
            margin: 0 auto;
            background: #ffffff;
            color: #1f2937;
            border-radius: 24px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.1);
            padding: 36px;
            position: relative;
            z-index: 1;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .invoice-details {
            flex: 1;
            min-width: 240px;
        }

        .invoice-badge-title {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #111827;
            margin-bottom: 10px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 10px;
            align-items: center;
            max-width: 290px;
        }

        .meta-grid label {
            font-size: 0.84rem;
            font-weight: 600;
            color: #6b7280;
        }

        /* Editable Company / Sender Info */
        .company-details {
            flex: 1.15;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            gap: 5px;
        }

        .logo-uploader {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-bottom: 4px;
        }

        .company-logo {
            max-width: 110px;
            max-height: 70px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
            padding: 4px;
            background: #ffffff;
            cursor: pointer;
        }

        .logo-controls {
            display: flex;
            gap: 6px;
        }

        .mini-chip-btn {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
        }

        .mini-chip-btn:hover {
            border-color: #ec489a;
            color: #db2777;
        }

        .input-field {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.86rem;
            color: #1f2937;
            background: #f8fafc;
            font-family: 'Outfit', sans-serif;
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
        }

        .input-field:focus {
            outline: none;
            border-color: #ec489a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.12);
        }

        .company-input {
            text-align: right;
            max-width: 340px;
        }

        .company-name-input {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111827;
        }

        .bill-currency-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .bill-to-section {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-heading {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ec489a;
            margin-bottom: 4px;
        }

        .currency-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .currency-box label {
            font-size: 0.84rem;
            font-weight: 600;
            color: #4b5563;
        }

        .currency-box input {
            width: 56px;
            text-align: center;
            font-weight: 700;
        }

        /* Items Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 8px 10px;
            font-size: 0.85rem;
            vertical-align: top;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
            color: #374151;
            text-align: left;
        }

        .description-col { width: 48%; }
        .qty-col { width: 12%; text-align: center; }
        .rate-col { width: 18%; text-align: right; }
        .amount-col { width: 14%; text-align: right; font-weight: 700; }
        .action-col { width: 8%; text-align: center; }

        .total-row {
            background: #f8fafc;
            font-weight: 700;
        }

        .remove-item-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .remove-item-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* Balance Summary */
        .summary-row-wrap {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .balance-summary {
            margin-left: auto;
            width: 100%;
            max-width: 300px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 12px 14px;
        }

        .balance-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.86rem;
        }

        .balance-line:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1.5px solid #cbd5e1;
            font-weight: 800;
            font-size: 0.96rem;
            color: #16a34a;
        }

        .balance-line input {
            width: 110px;
            text-align: right;
            font-weight: 600;
        }

        /* Editable Payment & Notes */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 2px solid #f1f5f9;
        }

        .payment-box,
        .notes-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .notes-box textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.45;
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            font-size: 0.78rem;
            color: var(--muted-color);
            position: relative;
            z-index: 1;
        }

        .copyright a {
            color: #ec489a;
            text-decoration: none;
            font-weight: 600;
        }

        /* PDF Mode Cleanups */
        .pdf-mode {
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        .pdf-mode .no-pdf,
        .pdf-mode .action-col,
        .pdf-mode .logo-controls,
        .pdf-mode .currency-box {
            display: none !important;
        }

        .pdf-mode .company-logo {
            border: none !important;
            padding: 0 !important;
        }

        .pdf-temp-text {
            font-family: 'Outfit', sans-serif;
            color: #1f2937;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            color: #ffffff;
            font-weight: 700;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ec489a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--message-box-bg);
            color: var(--message-box-text);
            padding: 0.8rem 1.35rem;
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--message-box-border);
            font-weight: 600;
            font-size: 0.88rem;
        }

        .message-box.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box.error {
            background-color: var(--message-box-error-bg);
            color: var(--message-box-error-text);
            border-color: var(--message-box-error-border);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 720px) {
            body {
                padding: 68px 10px 24px;
            }
            .invoice-container {
                padding: 18px;
                border-radius: 20px;
            }
            .company-details {
                align-items: flex-start;
                text-align: left;
            }
            .company-input {
                text-align: left;
                max-width: none;
            }
            .logo-uploader {
                align-items: flex-start;
            }
            .bottom-grid {
                grid-template-columns: 1fr;
            }
            th, td {
                padding: 6px 5px;
                font-size: 0.75rem;
            }
        }

        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
            }
            body::before,
            .top-bar,
            .app-toolbar,
            .no-pdf,
            .action-col,
            .logo-controls,
            .currency-box,
            .copyright,
            .message-box {
                display: none !important;
            }
            .invoice-container {
                box-shadow: none !important;
                padding: 10px !important;
                max-width: none !important;
            }
            .company-logo {
                border: none !important;
            }
            .input-field {
                border: none !important;
                background: transparent !important;
                padding: 1px 0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="https://apps.mahsua.com/" class="top-pill-btn">
            <span>🏠</span> <span>Mahsua Apps</span>
        </a>
        <button id="modeToggleBtn" class="top-pill-btn" onclick="toggleDarkMode()">
            <span id="modeIcon">🌙</span> <span id="modeText">Dark Mode</span>
        </button>
    </div>

    <!-- App Toolbar -->
    <div class="app-toolbar">
        <div class="toolbar-title-wrap">
            <h1>🧾 Invoice Generator</h1>
            <p>Your business info &amp; logo save automatically on this device</p>
        </div>
        <div class="toolbar-actions">
            <button type="button" class="btn btn-outline" onclick="resetBusinessProfile()" title="Reset saved business & payment info">↺ Reset Business Info</button>
            <button type="button" class="btn btn-danger-soft" onclick="clearCurrentInvoice()">🗑 Clear Invoice</button>
            <button type="button" class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
            <button type="button" class="btn btn-green" id="generatePdfBtn">📄 Download PDF</button>
        </div>
    </div>

    <!-- Invoice Paper -->
    <div class="invoice-container" id="invoiceContent">
        <div class="header-section">
            <div class="invoice-details">
                <div class="invoice-badge-title">INVOICE</div>
                <div class="meta-grid">
                    <label for="invoiceNumber">Invoice #:</label>
                    <input type="text" id="invoiceNumber" class="input-field" value="001">

                    <label for="invoiceDate">Date:</label>
                    <input type="date" id="invoiceDate" class="input-field">

                    <label for="dueDate">Due Date:</label>
                    <input type="date" id="dueDate" class="input-field">
                </div>
            </div>

            <!-- Editable Company Info + Logo -->
            <div class="company-details">
                <div class="logo-uploader">
                    <img id="companyLogoPreview" src="./logo.png" onerror="this.onerror=null;this.src='https://placehold.co/110x55/ec489a/ffffff?text=YOUR+LOGO';" alt="Company Logo" class="company-logo" onclick="document.getElementById('logoFileInput').click()" title="Click to upload your logo">
                    <input type="file" id="logoFileInput" accept="image/*" class="hidden">
                    <div class="logo-controls">
                        <button type="button" class="mini-chip-btn" onclick="document.getElementById('logoFileInput').click()">📷 Change Logo</button>
                        <button type="button" class="mini-chip-btn" onclick="removeCustomLogo()">✕ Default</button>
                    </div>
                </div>
                <input type="text" id="bizName" class="input-field company-input company-name-input" placeholder="Your Business / Company Name">
                <input type="email" id="bizEmail" class="input-field company-input" placeholder="your@business.com">
                <input type="text" id="bizPhone" class="input-field company-input" placeholder="+91 98765 43210">
                <input type="text" id="bizWebsite" class="input-field company-input" placeholder="www.yourwebsite.com">
                <textarea id="bizAddress" class="input-field company-input" rows="2" placeholder="Business Street, City, State, ZIP"></textarea>
            </div>
        </div>

        <!-- Bill To & Currency -->
        <div class="bill-currency-row">
            <div class="bill-to-section">
                <div class="section-heading">Bill To</div>
                <input type="text" id="clientName" class="input-field" placeholder="Client Name">
                <input type="text" id="clientCompany" class="input-field" placeholder="Client Company / Organization">
                <input type="email" id="clientEmail" class="input-field" placeholder="client@email.com">
                <input type="text" id="clientAddress" class="input-field" placeholder="Client Address (Optional)">
            </div>

            <div class="currency-box">
                <label for="currencySymbol">Currency:</label>
                <input type="text" id="currencySymbol" class="input-field" value="₹" maxlength="4">
            </div>
        </div>

        <!-- Line Items Table -->
        <table>
            <thead>
                <tr>
                    <th class="description-col">Description</th>
                    <th class="qty-col">Qty</th>
                    <th class="rate-col">Unit Rate</th>
                    <th class="amount-col">Amount</th>
                    <th class="action-col"></th>
                </tr>
            </thead>
            <tbody id="serviceItems"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="3" style="text-align: right; padding-right: 12px;">Total</td>
                    <td id="grandTotal" class="amount-col">₹0</td>
                    <td class="action-col"></td>
                </tr>
            </tfoot>
        </table>

        <div class="summary-row-wrap">
            <button type="button" id="addItemBtn" class="btn btn-primary no-pdf">+ Add Line Item</button>

            <div class="balance-summary">
                <div class="balance-line">
                    <label for="advancePaymentInput">Advance Paid:</label>
                    <input type="number" id="advancePaymentInput" class="input-field" value="0" min="0" step="0.01">
                </div>
                <div class="balance-line">
                    <span>Remaining Balance:</span>
                    <span id="remainingBalance">₹0</span>
                </div>
            </div>
        </div>

        <!-- Editable Payment Instructions & Notes -->
        <div class="bottom-grid">
            <div class="payment-box">
                <div class="section-heading">Payment Instructions</div>
                <input type="text" id="payBank" class="input-field" placeholder="Bank Name">
                <input type="text" id="payAccount" class="input-field" placeholder="Account Number">
                <input type="text" id="payIfsc" class="input-field" placeholder="IFSC / Routing Code">
                <input type="text" id="payUpi" class="input-field" placeholder="UPI ID (e.g., name@upi)">
                <input type="text" id="payPaypal" class="input-field" placeholder="PayPal / International (Optional)">
            </div>

            <div class="notes-box">
                <div class="section-heading">Terms &amp; Notes</div>
                <textarea id="invoiceNotes" class="input-field" placeholder="* Payment due within 7 days.&#10;* Thank you for your business!"></textarea>
            </div>
        </div>
    </div>

    <div class="copyright">
        Made With ❤️ INDIA ~ Designed by <a href="https://proshivamkushwaha.mahsua.com" target="_blank">SHIVAM KUSHWAHA</a> | © <a href="https://www.mahsua.com" target="_blank">MAHSUA</a>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <span>Generating PDF...</span>
    </div>

    <div id="messageBox" class="message-box"></div>

    <script>
        const BIZ_STORAGE_KEY = 'mahsua_invoice_business_v1';
        const DRAFT_STORAGE_KEY = 'mahsua_invoice_draft_v1';
        const DEFAULT_LOGO_SRC = './logo.png';

        const DEFAULT_BIZ = {
            logoDataUrl: '',
            bizName: 'MAHSUA INDIA',
            bizEmail: 'mahsuaindia@gmail.com',
            bizPhone: '+91 9752107808',
            bizWebsite: 'www.mahsua.com',
            bizAddress: 'AE 545, HB Colony, Pithampur Industrial Area, Indore, MP, 454775',
            currency: '₹',
            payBank: 'Bank: Your Bank Name',
            payAccount: 'A/C No: 0000000000',
            payIfsc: 'IFSC: ABCD0000000',
            payUpi: 'UPI: yourname@upi',
            payPaypal: '',
            invoiceNotes: '* Payment due within 7 days.\n* Thank you for your business!'
        };



        const serviceItemsContainer = document.getElementById('serviceItems');
        const grandTotalSpan = document.getElementById('grandTotal');
        const remainingBalanceSpan = document.getElementById('remainingBalance');
        const currencySymbolInput = document.getElementById('currencySymbol');
        const advancePaymentInput = document.getElementById('advancePaymentInput');
        const companyLogoPreview = document.getElementById('companyLogoPreview');
        const logoFileInput = document.getElementById('logoFileInput');
        const invoiceContent = document.getElementById('invoiceContent');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const messageBox = document.getElementById('messageBox');
        const modeIcon = document.getElementById('modeIcon');
        const modeText = document.getElementById('modeText');

        let currentAppMode = localStorage.getItem('displayMode') || 'light';
        let customLogoDataUrl = '';

        function applyAppMode(mode) {
            currentAppMode = mode;
            document.body.setAttribute('data-mode', mode);
            localStorage.setItem('displayMode', mode);
            modeIcon.textContent = mode === 'dark' ? '☀️' : '🌙';
            modeText.textContent = mode === 'dark' ? 'Light Mode' : 'Dark Mode';
        }

        function toggleDarkMode() {
            applyAppMode(currentAppMode === 'light' ? 'dark' : 'light');
        }

        function getLocalDateStr(offsetDays = 0) {
            const dt = new Date();
            dt.setDate(dt.getDate() + offsetDays);
            return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        }

        function setDefaultDates() {
            document.getElementById('invoiceDate').value = getLocalDateStr(0);
            document.getElementById('dueDate').value = getLocalDateStr(7);
        }

        function formatCurrency(amount) {
            const symbol = currencySymbolInput.value || '₹';
            return `${symbol}${Number(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
        }

        function updateTotals() {
            let totalAmount = 0;
            serviceItemsContainer.querySelectorAll('tr').forEach(row => {
                const qty = parseFloat(row.querySelector('.service-qty').value) || 0;
                const unitRate = parseFloat(row.querySelector('.service-rate').value) || 0;
                const lineAmount = qty * unitRate;
                row.querySelector('.line-amount-cell').textContent = formatCurrency(lineAmount);
                totalAmount += lineAmount;
            });

            grandTotalSpan.textContent = formatCurrency(totalAmount);
            const advance = parseFloat(advancePaymentInput.value) || 0;
            remainingBalanceSpan.textContent = formatCurrency(totalAmount - advance);
            saveInvoiceDraft();
        }

        function addServiceItem(data = { description: '', qty: 1, rate: 0 }) {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td class="description-col">
                    <input type="text" class="input-field service-description" placeholder="Enter item or service description">
                </td>
                <td class="qty-col"><input type="number" class="input-field service-qty" min="1" step="1" style="text-align:center;"></td>
                <td class="rate-col"><input type="number" class="input-field service-rate" min="0" step="0.01" style="text-align:right;"></td>
                <td class="amount-col line-amount-cell">₹0</td>
                <td class="action-col"><button type="button" class="remove-item-btn" title="Remove item">✕</button></td>
            `;

            row.querySelector('.service-qty').value = data.qty ?? 1;
            row.querySelector('.service-rate').value = Number(data.rate ?? 0).toFixed(2);
            row.querySelector('.service-description').value = data.description || '';

            const descEl = row.querySelector('.service-description');
            const qtyEl = row.querySelector('.service-qty');
            const rateEl = row.querySelector('.service-rate');

            [descEl, qtyEl, rateEl].forEach(el => el.addEventListener('input', updateTotals));
            row.querySelector('.remove-item-btn').addEventListener('click', () => {
                row.remove();
                updateTotals();
            });

            serviceItemsContainer.appendChild(row);
            updateTotals();
        }

        // Save & Load Business Profile (Persists across sessions in localStorage)
        const BIZ_FIELDS = ['bizName', 'bizEmail', 'bizPhone', 'bizWebsite', 'bizAddress', 'payBank', 'payAccount', 'payIfsc', 'payUpi', 'payPaypal', 'invoiceNotes'];

        function saveBusinessProfile() {
            try {
                const profile = { logoDataUrl: customLogoDataUrl, currency: currencySymbolInput.value };
                BIZ_FIELDS.forEach(id => {
                    profile[id] = document.getElementById(id).value;
                });
                localStorage.setItem(BIZ_STORAGE_KEY, JSON.stringify(profile));
            } catch {
                // Ignore storage quota errors
            }
        }

        function loadBusinessProfile() {
            let profile = { ...DEFAULT_BIZ };
            try {
                const saved = localStorage.getItem(BIZ_STORAGE_KEY);
                if (saved) profile = { ...DEFAULT_BIZ, ...JSON.parse(saved) };
            } catch {
                // Use default
            }

            BIZ_FIELDS.forEach(id => {
                document.getElementById(id).value = profile[id] || '';
            });
            currencySymbolInput.value = profile.currency || '₹';
            customLogoDataUrl = profile.logoDataUrl || '';
            companyLogoPreview.src = customLogoDataUrl || DEFAULT_LOGO_SRC;
        }

        function resetBusinessProfile() {
            localStorage.removeItem(BIZ_STORAGE_KEY);
            loadBusinessProfile();
            updateTotals();
            displayMessage('Business profile reset to defaults.');
        }

        // Logo upload with automatic resize so it fits cleanly in localStorage
        logoFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 260;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        const scale = Math.min(maxDim / w, maxDim / h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    customLogoDataUrl = canvas.toDataURL('image/png');
                    companyLogoPreview.src = customLogoDataUrl;
                    saveBusinessProfile();
                    displayMessage('Logo saved to your device!');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function removeCustomLogo() {
            customLogoDataUrl = '';
            logoFileInput.value = '';
            companyLogoPreview.src = DEFAULT_LOGO_SRC;
            saveBusinessProfile();
            displayMessage('Logo reset to default.');
        }

        // Save & Load Current Invoice Draft
        const DRAFT_FIELDS = ['invoiceNumber', 'invoiceDate', 'dueDate', 'clientName', 'clientCompany', 'clientEmail', 'clientAddress', 'advancePaymentInput'];

        function saveInvoiceDraft() {
            try {
                const items = Array.from(serviceItemsContainer.querySelectorAll('tr')).map(row => ({
                    description: row.querySelector('.service-description').value,
                    qty: parseFloat(row.querySelector('.service-qty').value) || 1,
                    rate: parseFloat(row.querySelector('.service-rate').value) || 0
                }));
                const draft = { items };
                DRAFT_FIELDS.forEach(id => {
                    draft[id] = document.getElementById(id).value;
                });
                localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draft));
            } catch {
                // Ignore
            }
        }

        function loadInvoiceDraft() {
            try {
                const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
                if (!raw) {
                    setDefaultDates();
                    addServiceItem({ id: 'custom', description: '', qty: 1, rate: 0 });
                    return;
                }
                const draft = JSON.parse(raw);
                DRAFT_FIELDS.forEach(id => {
                    if (draft[id] !== undefined) document.getElementById(id).value = draft[id];
                });
                if (!document.getElementById('invoiceDate').value) setDefaultDates();

                serviceItemsContainer.innerHTML = '';
                if (draft.items && draft.items.length > 0) {
                    draft.items.forEach(addServiceItem);
                } else {
                    addServiceItem({ id: 'custom', description: '', qty: 1, rate: 0 });
                }
            } catch {
                setDefaultDates();
                addServiceItem({ id: 'custom', description: '', qty: 1, rate: 0 });
            }
        }

        function clearCurrentInvoice() {
            document.getElementById('invoiceNumber').value = '001';
            setDefaultDates();
            ['clientName', 'clientCompany', 'clientEmail', 'clientAddress'].forEach(id => {
                document.getElementById(id).value = '';
            });
            advancePaymentInput.value = '0';
            serviceItemsContainer.innerHTML = '';
            addServiceItem({ id: 'custom', description: '', qty: 1, rate: 0 });
            localStorage.removeItem(DRAFT_STORAGE_KEY);
            updateTotals();
            displayMessage('Invoice cleared (your business info is kept).');
        }

        // PDF Export
        document.getElementById('generatePdfBtn').addEventListener('click', () => {
            if (typeof html2pdf === 'undefined') {
                displayMessage('PDF library unavailable — use Print -> Save as PDF.', 'error');
                return;
            }
            loadingOverlay.classList.remove('hidden');
            const restores = [];

            const swapToText = (el, text, align = '') => {
                if (!el || !el.parentNode) return;
                const span = document.createElement('span');
                span.className = 'pdf-temp-text';
                span.textContent = text;
                span.style.display = el.tagName === 'TEXTAREA' ? 'block' : 'inline-block';
                span.style.width = el.style.width || (el.classList.contains('company-input') ? '100%' : 'auto');
                if (align) span.style.textAlign = align;
                span.style.fontSize = getComputedStyle(el).fontSize;
                span.style.fontWeight = getComputedStyle(el).fontWeight;
                if (!text) span.style.display = 'none';

                restores.push({ el, prevDisplay: el.style.display });
                el.style.display = 'none';
                el.parentNode.insertBefore(span, el.nextSibling);
            };

            // Swap inputs/textareas to crisp text
            invoiceContent.querySelectorAll('input:not([type="file"]), textarea').forEach(el => {
                const align = el.classList.contains('company-input') ? 'right' : (el.style.textAlign || '');
                swapToText(el, el.value, align);
            });

            invoiceContent.classList.add('pdf-mode');

            const invNum = (document.getElementById('invoiceNumber').value || '001').trim();
            const options = {
                margin: 8,
                filename: `invoice_${invNum}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const cleanup = () => {
                invoiceContent.classList.remove('pdf-mode');
                invoiceContent.querySelectorAll('.pdf-temp-text').forEach(s => s.remove());
                restores.forEach(r => { r.el.style.display = r.prevDisplay; });
                loadingOverlay.classList.add('hidden');
            };

            html2pdf().set(options).from(invoiceContent).save().then(() => {
                cleanup();
                displayMessage('Invoice PDF downloaded!');
            }).catch(() => {
                cleanup();
                displayMessage('PDF export failed — try Print -> Save as PDF.', 'error');
            });
        });

        function displayMessage(msg, type = 'success') {
            messageBox.textContent = msg;
            messageBox.className = 'message-box show' + (type === 'error' ? ' error' : '');
            setTimeout(() => messageBox.classList.remove('show'), 2800);
        }

        // Auto-save listeners
        BIZ_FIELDS.forEach(id => {
            document.getElementById(id).addEventListener('input', saveBusinessProfile);
        });
        currencySymbolInput.addEventListener('input', () => {
            saveBusinessProfile();
            updateTotals();
        });
        DRAFT_FIELDS.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                if (id === 'advancePaymentInput') updateTotals();
                else saveInvoiceDraft();
            });
        });
        document.getElementById('addItemBtn').addEventListener('click', () => addServiceItem());

        window.onload = function() {
            applyAppMode(currentAppMode);
            loadBusinessProfile();
            loadInvoiceDraft();
            updateTotals();
        };
    </script>
</body>
</html>
